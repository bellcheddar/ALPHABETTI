# Rate-limit zone for ALPHABETTI, installed to /etc/nginx/conf.d/ by
# provision.sh. A limit_req_zone must be declared at http scope, which a
# sites-available file is not, hence the separate snippet.
#
# Ten a minute with a burst of four. A fold costs ZeroGPU quota on a shared
# Hugging Face account, so this is protecting a finite external resource rather
# than the box: generous for a person exploring, tight enough that nobody can
# drain the day's quota in a loop.
limit_req_zone $binary_remote_addr zone=alphabetti_submit:10m rate=10r/m;
