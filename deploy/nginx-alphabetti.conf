# nginx site for ALPHABETTI. provision.sh substitutes __SERVER_NAME__ and
# __BIND_ADDR__, then installs this to /etc/nginx/sites-available/alphabetti, then certbot --nginx
# adds the TLS block.
#
# The droplet runs nginx 1.24.0, so the HTTP/2 directive is the per-listener
# form `listen 443 ssl http2;`, NOT the `http2 on;` introduced in 1.25.1.
# Certbot writes `listen 443 ssl;` and http2 has to be appended to that line
# afterwards. Getting it wrong fails `nginx -t`, nginx keeps serving the old
# config, and the patch silently does not apply.
#   grep -h "listen 443" /etc/nginx/sites-available/*   shows the correct form.

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # A sequence is at most 400 residues plus FASTA headers. Anything larger is
    # a mistake or an attack.
    client_max_body_size 64k;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml text/csv;
    gzip_min_length 1024;
    gzip_comp_level 5;

    location /static/ {
        alias /opt/alphabetti/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Logging stays ON here, deliberately. mdeller.com's launcher counts a
        # hit for this app by watching for a request only a rendering browser
        # makes; with `access_log off;` those requests are invisible and the hit
        # count reads zero forever with nothing to indicate why. The beacon for
        # alphabetti is the 3D typeface, which a scanner never fetches.
    }

    # The HTML itself must NOT be cached, or a deploy stays invisible behind
    # heuristic caching while the CSS and JS sit at a year. Flask sends no
    # Cache-Control of its own on a template.
    location / {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MUST stay in sync with `timeout` in deploy/gunicorn.conf.py.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Status polling arrives about once a second per active fold. Cheap, but it
    # must never be cached or the client sees a stale stage forever.
    location /api/status/ {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # Submitting costs GPU quota on a shared account, so it is rate limited.
    location /api/submit {
        limit_req zone=alphabetti_submit burst=4 nodelay;
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # A computed result is immutable: it is keyed on the hash of the sequence.
    location /api/result/ {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
